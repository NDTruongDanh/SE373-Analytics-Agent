# CodeRabbit configuration for SE373 Analytics Agent.
# Reviews run automatically on every PR (including PRs into main) once the
# CodeRabbit GitHub App is installed on the repository.
# Docs: https://docs.coderabbit.ai/getting-started/yaml-configuration

language: en-US
tone_instructions: Direct, technical, no flattery. Cite file paths with line numbers.

reviews:
  profile: assertive
  auto_review:
    enabled: true
  high_level_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  suggested_labels: true
  auto_apply_labels: false
  poem: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!package-lock.yaml"
    - "!openwiki/**"
  path_instructions:
    - path: "docs/mcp_interface.md"
      instructions: |
        GENERATED FILE — never hand-edit. It is produced by `pnpm docs:interface`.
        If this file is edited manually in the diff, request changes and tell the
        author to edit `packages/contracts/**` instead and regenerate.
    - path: "packages/contracts/**"
      instructions: |
        Shared zod shapes owned by contracts; it may depend on zod only.
        Enforce: camelCase field names, closed vocab via z.enum, discriminated unions
        for variants, bounded inputs (.min/.max, z.iso.datetime), error codes from
        packages/contracts/src/errors.ts. Flag breaking changes (rename/remove,
        tightened types, error-code changes) — these need a CONTRACTS_VERSION major
        bump and agreement from every affected UC owner.
    - path: "packages/mcp-server/**"
      instructions: |
        Sole owner of DB I/O (pg/pg-cursor allowed ONLY here) via the agent_ro role.
        Enforce: SELECT/WITH read-only queries only, statement_timeout respected,
        server order auth → scope → zod → sqlGuard → access-policy → executor →
        PII scan → audit. Flag DDL/DML, dangerous functions, or missing audit logging.
    - path: "packages/agent/**"
      instructions: |
        Must NEVER import pg/pg-cursor or mcp-server/src/**. DB access only via the
        MCP client (run_query, describe_table) through ValidatedQueryExecutor
        (selective describe → generate → local pre-check → run_query → bounded ≤3
        repair). Synthesis nodes run with no tools bound. Route data answers through
        UC-03 verification (chart + numeric validators) on ok/no_data.
    - path: "apps/web/**"
      instructions: |
        Types from @shared/contracts only. No direct DB imports. Check for leaked
        secrets or raw PII in rendered output and trace payloads.
    - path: "packages/access-policy/**"
      instructions: |
        Pure policy + redaction only: no DB or network I/O. Flag any import of pg,
        fetch, or filesystem access.
    - path: ".github/workflows/**"
      instructions: |
        CI changes are sensitive (ask-first area). Verify the single `gate` job still
        aggregates all required jobs, branch protection context `gate` is untouched,
        and least-privilege permissions are preserved.
    - path: "**/*.test.ts"
      instructions: |
        New behavior requires eval cases (≥5 per UC, UC-01 full ≥30-question benchmark)
        plus shared safety attack cases, and one successful trace under traces/.
        Unit tests must not depend on live DB env (use describe.skipIf pattern).
    - path: "traces/**"
      instructions: |
        Traces must be redacted: no raw PII values. Flag any real-looking names,
        emails, phone numbers, or secret tokens.
  pre_merge_checks:
    custom_checks:
      - name: "No hand-edited interface"
        mode: warning
        instructions: |
          FAIL if docs/mcp_interface.md is modified without a matching change in
          packages/contracts/**. The file is generated by `pnpm docs:interface`.
      - name: "DB boundary respected"
        mode: error
        instructions: |
          FAIL if packages/agent/** or apps/web/** import pg, pg-cursor, or
          mcp-server/src/**. All DB I/O must go through the MCP run_query tool
          in mcp-server.
      - name: "No secrets or PII"
        mode: error
        instructions: |
          FAIL if the diff adds .env contents, API keys, tokens, private keys, or
          raw PII values (names, emails, phones) in code, tests, traces, or logs.
          Dev-only loopback DB credentials in docker/docker-compose.yml and CI are
          exempt; real tokens must come from Actions secrets.
  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
