# pnpm v11+ reads build approvals from here (not from package.json).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # 01-03 batch A (D-07, RESEARCH-reviewed): transitive via
  # pgsql-deparser -> plpgsql-deparser -> pg-proto-parser. Postinstall
  # (scripts/postinstall.js) only reads its parent package.json and prints
  # a version-scheme stderr warning; no network, writes, or codegen.
  "@launchql/protobufjs": true
  # Explicitly never run: @openuidev/lang-core postinstall is install-time
  # telemetry (its own source says "telemetry must never fail installation").
  # The library works without it; false keeps installs telemetry-free.
  # (pnpm v11: allowBuilds replaces neverBuiltDependencies.)
  "@openuidev/lang-core": false

packages:
  - "apps/*"
  - "packages/*"

# Shared version source of truth (pnpm default catalog, native — no extra deps).
# All workspace packages must reference these via `catalog:` instead of
# repeating ranges, so shared deps can never drift between packages.
catalog:
  "@langchain/langgraph": ^1.5.2
  "@langchain/langgraph-checkpoint-postgres": ^1.1.2
  "@modelcontextprotocol/sdk": ^1.32.2
  "@openuidev/react-lang": ^1.1.0
  "@openuidev/react-ui": ^0.18.5
  "@types/express": ^5.0.6
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  "@types/react": ^18.3.31
  "@types/react-dom": ^18.3.7
  "@vitejs/plugin-react": ^6.2.1
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  express: ^5.3.0
  jsdom: 29.1.1
  pg: ^8.23.1
  pino: ^10.4.0
  react: ^18.3.1
  react-dom: ^18.3.1
  vite: ^8.3.6
  yaml: ^2.9.1
  zod: ^4.6.7

# Security pins for transitive dependencies whose upstream range has no patched
# release. Each pin is covered by the workspace typecheck/lint/test gate.
overrides:
  # GHSA-238p-pmpm-9mq7 (low): KaTeX prototype pollution, patched in 0.18.2.
  # mermaid 12 already asks for ^0.18; rehype-katex 7 (web) declares ^0.16 but
  # only uses the stable katex.renderToString API, so it is pinned too.
  katex: 0.18.10
  # GHSA-g3hv-75wg-m249 (moderate): minimatch globpart amplification DoS,
  # patched in 11.0.1. ESLint 10 + typescript-eslint still declare ^10; the
  # minimatch()/Minimatch API they use is unchanged in v11.
  minimatch: 11.0.8
  # GHSA-mrhx-c7xc-m3w5 (high): zod < 4.6.6 memory exhaustion. @ag-ui/core
  # 0.0.53 pins vulnerable zod 3 with no v3 patch; 1.0.4 drops zod entirely.
  # @openuidev/react-headless only imports EventType, still exported by 1.0.4.
  "@ag-ui/core": 1.0.4

minimumReleaseAgeExclude:
  - '@openuidev/react-ui@0.18.5'
  - '@pgsql/traverse@18.8.5'
  - libpg-query@18.2.4
  - pgsql-deparser@18.4.4
  - plpgsql-deparser@18.3.4
