# pnpm v11+ reads build approvals from here (not from package.json).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # 01-03 batch A (D-07, RESEARCH-reviewed): transitive via
  # pgsql-deparser -> plpgsql-deparser -> pg-proto-parser. Postinstall
  # (scripts/postinstall.js) only reads its parent package.json and prints
  # a version-scheme stderr warning; no network, writes, or codegen.
  "@launchql/protobufjs": true

packages:
  - "apps/*"
  - "packages/*"

# Shared version source of truth (pnpm default catalog, native — no extra deps).
# All workspace packages must reference these via `catalog:` instead of
# repeating ranges, so shared deps can never drift between packages.
catalog:
  "@langchain/langgraph": ^1.5.2
  "@langchain/langgraph-checkpoint-postgres": ^1.1.2
  "@modelcontextprotocol/sdk": ^1.32.2
  "@types/express": ^5.0.6
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  express: ^5.3.0
  pg: ^8.23.1
  pino: ^10.4.0
  yaml: ^2.9.1
  zod: ^4.6.7
