# Local dev database (Phase 2, D-09): PostgreSQL 16 + pgvector on host port 5433.
# A clean clone works with zero setup: every variable below has a `:-` default,
# so no `.env` file is needed. Copy `.env.example` to `.env` only for
# key-holding runs (custom passwords are picked up via --project-directory .).
# Passwords come from the container environment; docker/initdb/01_roles.sh
# applies the same dev defaults, so server-side and client URLs never drift.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chosen}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-owner_dev_pw}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:-agent_ro_dev_pw}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-indexer_dev_pw}
    ports:
      # Loopback only: the dev roles use committed default passwords, so the
      # DB must never be reachable from other machines on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-chosen}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata: {}
