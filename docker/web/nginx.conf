# Static frontend for the analytics agent.
#
# The SPA is served from the Vite build output. Every `/api/*` request is
# reverse-proxied to the API container; buffering stays off so the SSE stream
# from POST /api/ask reaches the browser event by event.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API container after `compose up` recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Variable form forces a DNS lookup through the resolver above.
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: never buffer or cache the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
