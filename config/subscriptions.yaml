version: 1
subscriptions:
  # ANOM-01: Tỉ lệ hoàn đơn (Critical routing: realtime alert)
  - id: return-rate-daily
    metricId: metric:return_rate
    primaryDimension: orders.purchase_date
    suggestedSecondaryDimensions:
      - regions.province
      - categories.name_vi
    recipientId: "ops_lead"
    recipientRole: "operations"
    channel: webhook
    digestPreference: realtime
    absoluteThreshold:
      operator: above
      value: 0.10
      unit: ratio
    minSupport: 15

  # ANOM-02: Doanh thu thuần (Financial reporting: Slack digest with support threshold)
  - id: net-revenue-daily
    metricId: metric:net_revenue
    primaryDimension: orders.purchase_date
    suggestedSecondaryDimensions:
      - customers.region_group
      - orders.channel_id
    recipientId: "finance_lead"
    recipientRole: "finance"
    channel: slack
    digestPreference: digest
    absoluteThreshold:
      operator: below
      value: 10000000
      unit: vnd
    minSupport:
      minOrders: 15
      minMetricTrimmedMean: 500000

  # ANOM-03: Tỉ lệ huỷ đơn (Ops spike monitoring: Telegram realtime)
  - id: cancel-rate-daily
    metricId: metric:cancellation_rate
    primaryDimension: orders.purchase_date
    suggestedSecondaryDimensions:
      - orders.channel_id
      - payments.payment_type
    recipientId: "ops_lead"
    recipientRole: "operations"
    channel: telegram
    digestPreference: realtime
    absoluteThreshold:
      operator: above
      value: 0.10
      unit: ratio
    minSupport: 15

  # ANOM-04: Số đơn hàng mới (Sales lead daily summary: Email digest)
  - id: new-orders-daily
    metricId: metric:order_count
    primaryDimension: orders.purchase_date
    suggestedSecondaryDimensions:
      - sellers.province
      - sellers.seller_id
    recipientId: "sales_director"
    recipientRole: "sales_lead"
    channel: email
    digestPreference: digest
    absoluteThreshold:
      operator: above
      value: 100
      unit: orders
    minSupport: 15

  # ANOM-05: Điểm đánh giá trung bình (Support daily review: Webhook digest)
  - id: review-score-daily
    metricId: metric:review_score_avg
    primaryDimension: reviews.created_at
    suggestedSecondaryDimensions:
      - categories.name_vi
      - products.product_id
    recipientId: "customer_experience"
    recipientRole: "support_lead"
    channel: webhook
    digestPreference: digest
    absoluteThreshold:
      operator: below
      value: 3.0
      unit: stars
    minSupport: 15
