name: setup-js
description: Set up pnpm + Node.js and install frozen dependencies (shared by CI jobs).

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"
  pnpm-version:
    description: pnpm version to install (must match packageManager in package.json).
    required: false
    default: "11.25.0"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
